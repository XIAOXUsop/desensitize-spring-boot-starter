name: Release

# 打 tag 即发布：jar 自动挂到 GitHub Release。
# 未上 Maven Central 的情况下，Release 产物是使用者唯一的"下载即用"入口。
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 读 Dependabot 告警需要它。缺了会 403，而预检把 403 判为**拒绝发布**
      # 而不是"没有告警"——两者在日志里长得一模一样。
      security-events: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 闸二要比对"这个 tag 落后默认分支多少"，浅克隆没有历史可比。
          fetch-depth: 0

      # 发版前置检查：产物不该带着已知漏洞出门，也不该落后于默认分支。
      #
      # 为什么是 release 而不是 CI：Dependabot 告警是**仓库级**状态，不属于任何一次提交，
      # 放进 CI 会让默认分支因为一条与本次改动无关的告警长期变红——而常年红的门禁
      # 等于没有门禁（姊妹项目 amlagent 缺 NVD API key，依赖扫描就永远跑不完）。
      # 放在发版这一步，代价被限制成"这次先别发"，而发布本来也不该是全自动的。
      #
      # 两道闸缺一不可：闸一查的是**默认分支当前**的依赖图，闸二查的是**这个 tag**。
      # 只留闸一的话，「master 上已修好、产物里还是旧的」这种情况看起来完全正常——
      # 干净的是 master，不是那个产物。
      #
      # 对这个仓库尤其实际：本仓库的 Release 是使用者唯一的"下载即用"入口
      # （还没上 Maven Central），所以"发出去的那份落后于 master"的代价比别处更高。
      - name: Preflight (dependency alerts + tag vs default branch)
        env:
          # 闸一优先用 PAT：**Dependabot 告警接口不接受 GITHUB_TOKEN**。
          # 实测（2026-09-20，在 ctxpress 上）：即便给 GITHUB_TOKEN 授
          # `security-events: read`，仍然返回 403 `Resource not accessible by integration`；
          # 匿名访问是 401。配了 `PREFLIGHT_TOKEN`（一个 PAT）才真正查得动。
          GH_TOKEN: ${{ secrets.PREFLIGHT_TOKEN || secrets.GITHUB_TOKEN }}
          # 没配 PAT 时把闸一降级为「大声告警后放行」。**这不是为了省事**——
          # 是"整条发布流程永久卡死"与"明确降级并说清楚"之间的取舍；
          # 真读到高危告警时，脚本照样拒绝（那条路径不受影响）。
          PREFLIGHT_ALERTS_OPTIONAL: ${{ secrets.PREFLIGHT_TOKEN == '' && '1' || '' }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          base="origin/${{ github.event.repository.default_branch }}"
          out="$RUNNER_TEMP"

          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"

          # -w 把状态码单独写出来，而不是靠"响应体为空"去猜。
          # 空数组和 403/404 的响应体都不是"一大堆告警"，靠内容猜必然误判。
          curl -sS -o "$out/alerts.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/dependabot/alerts?state=open&per_page=100" \
            > "$out/alerts.http"

          args=(--alerts-http "$out/alerts.http" --alerts-json "$out/alerts.json"
                --tag "${{ github.ref_name }}" --base "$base")
          if [ -n "${PREFLIGHT_ALERTS_OPTIONAL:-}" ]; then
            echo "::warning::未配置 PREFLIGHT_TOKEN——闸一（依赖告警）本轮无法执行，降级为告警放行。Dependabot 告警接口不接受 GITHUB_TOKEN。配一个 PAT 作为仓库 secret 即可启用。"
            args+=(--alerts-optional)
          fi

          python3 scripts/release_preflight.py "${args[@]}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw -B package

      # 除了带版本号的产物，再挂一份**不带版本号**的副本。
      #
      # 为什么需要：README 的「下载即用」一行用的是
      # `releases/latest/download/<文件名>`，而 `latest` 指的是**最新那个 Release**，
      # 并**按文件名**取产物。所以文件名里一旦带版本号，那个 URL 会在**下一个版本
      # 发布之后直接 404**——v0.6.1 的资产不会出现在 v0.7.0 的 Release 里。
      # （对照：ctxpress 与 mcp-sentinel 的产物名不带版本，下载命令因此一直有效。）
      #
      # 多挂一份稳定的名字之后，README 就能写成版本无关的一行，且不必每次发版去改。
      # `grep -v` 是防御性的：当前跑的是不带 `-P` 的 `package`，不会产出 sources/javadoc，
      # 但将来若有人在这里加上 `-Prelease`，通配就会匹配到三个文件、`cp` 会直接失败。
      - name: Add a version-free alias
        run: |
          main=$(ls target/desensitize-spring-boot-starter-*.jar | grep -v sources | grep -v javadoc | head -1)
          cp "$main" target/desensitize-spring-boot-starter.jar

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/desensitize-spring-boot-starter-*.jar
            target/desensitize-spring-boot-starter.jar
          generate_release_notes: true
