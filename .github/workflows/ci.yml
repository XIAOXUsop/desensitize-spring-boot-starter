name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 用 wrapper（`./mvnw`）而不是 runner 上的 `mvn`：跑测试的 Maven 版本
      # 与发版用的必须一致，否则「本地跑绿的、Release 里构建出来的不一样」——
      # 实测过这个差别是真的：已发布的 v0.6.1 与一台用系统 Maven 3.3.9 构建的
      # 同名 jar，`META-INF/MANIFEST.MF` 的 `Created-By` 一个写
      # `Maven JAR Plugin 3.5.0`、一个写 `Apache Maven 3.3.9`，还多一行
      # `Built-By: <构建机器的用户名>`。见 `.mvn/wrapper/maven-wrapper.properties`。
      - name: Run tests
        run: ./mvnw -B test

      # README 里的测试条数必须等于真实跑出来的条数。
      #
      # 实测（2026-09-22）：同一页上有两处声称，一处写 110、一处写 107，
      # 而真实是 **110**（Maven 输出、Surefire XML、源码注解数三处一致）。
      # 改 README 时漏改了一处，**两句话在同一页上互相矛盾**。
      #
      # 这类数字没有任何东西守着就一定会漂——本工作区里 letterpress 漂到过 263
      # （实际 270）、mcp-sentinel 漂到过 127（实际 131）；有门禁的两处就没漂。
      #
      # 它读的是上一步 `./mvnw -B test` 写下的 Surefire XML，所以必须紧跟其后。
      # 读不到产物**就是失败**，不是跳过——否则把测试那步拿掉，这条会静默失效。
      - name: README 测试条数对账
        run: python3 scripts/check_readme_test_count.py

  release-gate-selftest:
    name: Release Gate Self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 发版前那道闸（scripts/release_preflight.py）决定一个 tag 能不能变成 Release，
      # 它自己不能是没验过的。用例里每一条都对应一次真实事故或一个真实的误读风险，
      # 尤其是「查不动 != 通过」那几条：HTTP 403、响应不是数组、级别字段不认识、
      # git 历史取不到——这些在日志里的表现和"没有告警"完全一样。
      #
      # 反向验证过（2026-09-22 逐个重跑）：拿掉 `if unknown:` 会让 **3** 条红、
      # 把 403 从 platform_limited 里去掉会让 **1** 条红、拿掉 `if risky:` 会让 **2** 条红。
      # （这里原先写的是 2 / 1 / 2——第一个数字在测试增补之后就过期了。
      #   写"让 N 条变红"而不写清改的是哪一处，正是这类数字最容易被读成"验过了"。）
      - name: Test the release preflight gate
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
